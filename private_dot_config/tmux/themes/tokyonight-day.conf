# Loaded by tmux-dark-notify when macOS switches to light appearance.
set -g @tokyo-night-tmux_theme day
run-shell "$HOME/.tmux/plugins/tokyo-night-tmux/tokyo-night.tmux"

source-file "$HOME/.config/tmux/themes/tokyonight-status-right.conf"

# The Tokyo Night plugin sets status-left during initialization, so the
# high-contrast override must follow it.
set -g status-left "#[fg=#e1e2e7,bg=#34548a,bold] #{?client_prefix,󰠠 ,󰤂 }#S@#H "
